name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 PM UTC every Monday and Thursday (twice a week)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive database request
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
      
      - name: Log success
        run: echo "✅ Supabase keep-alive ping successful!"
